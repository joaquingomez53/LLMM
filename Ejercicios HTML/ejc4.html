<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menús de listas</title>
    <link rel="stylesheet" href="cssejercicios.css">
</head>
<body>

        <h2>lista no ordenada -&gt; menu horizontal</h2>
        
        <ul class="menu-horizontal">
            <li>opcion1</li>
            <li>opcion2</li>
            <li>opcion3</li>
            <li>opcion4</li>
            <li>opcion5</li>
        </ul>

        <hr class="separador">

        <h2>lista no ordenada -&gt; menu vertical</h2>

        <ul class="menu-vertical">
            <li>opcion1</li>
            <li>opcion2</li>
            <li class="activo">opcion3</li>
            <li>opcion4</li>
            <li>opcion5</li>
        </ul>

        <hr class="separador">

    </div>

</body>
</html>
