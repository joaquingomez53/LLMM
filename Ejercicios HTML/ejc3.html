<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listas HTML y CSS</title>
    <link rel="stylesheet" href="cssejercicios.css">
</head>
<body>

    <!-- BLOQUE LISTA NO ORDENADA -->
    <div class="banner">lista no ordenada</div>

    <ul class="lista-no-ordenada">
        <li>opcion1</li>
        <li>opcion2
            <ul>
                <li>opcion21</li>
                <li>opcion22</li>
            </ul>
        </li>
        <li>opcion3</li>
        <li>opcion4</li>
        <li>opcion5</li>
    </ul>

    <hr class="separador">

    <!-- BLOQUE LISTA ORDENADA -->
    <div class="banner">lista ordenada</div>

    <ol class="lista-ordenada">
        <li>opcion1</li>
        <li>opcion2
            <ul class="sublista-cuadrados">
                <li>opcion21</li>
                <li>opcion22</li>
            </ul>
        </li>
        <li>opcion3</li>
        <li>opcion4
            <ol type="a">
                <li>opcion41
                    <ol type="i">
                        <li>opcion411</li>
                        <li>opcion412</li>
                    </ol>
                </li>
                <li>opcion42</li>
            </ol>
        </li>
        <li>opcion5</li>
    </ol>

    <hr class="separador">

</body>
</html>
